<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">G-FSCIL session-wise accuracy</title>
  <desc id="desc">Top-1 accuracy over twenty sessions on CUB-200-2011 and ImageNet-R.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
