name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      # The same ladder aura.environment climbs. pip 24.1 skips any release
      # whose metadata is not valid PEP 440 and then reports it as missing, so
      # a baseline that needs an older installer would fail here and every
      # Dependabot pull request with it -- scoring this arm on a repository
      # that never worked rather than on what Dependabot proposed.
      # Then, as the arms do, the build tools of the pins' own era for a
      # source distribution a current setuptools can no longer build.
      - run: |
          python -m pip install -r requirements.txt || { python -m pip install -q pip==24.0 && python -m pip install -r requirements.txt; } || { python -m pip install -q setuptools==57.0.0 wheel==0.36.2 && python -m pip install --no-build-isolation -r requirements.txt; }
          python -m pip install "setuptools<70" "pytest==7.1.3"
      # --deselect: tests that fail before anything is bumped. CI judges a
      # pull request absolutely, the arms judge against the baseline; without
      # this the project's own broken test fails every pull request.
      - run: python -m pytest tests/test_config.py tests/test_data_pipeline.py --deselect tests/test_config.py::test_public_configs --deselect tests/test_data_pipeline.py::test_augmented_dataset --deselect tests/test_data_pipeline.py::test_data_manager_kshot --deselect tests/test_data_pipeline.py::test_gen_dataset_paths --deselect tests/test_data_pipeline.py::test_learner_syn_path_helpers --deselect tests/test_data_pipeline.py::test_mask_bank --deselect tests/test_data_pipeline.py::test_syn_dataset_and_mixing
